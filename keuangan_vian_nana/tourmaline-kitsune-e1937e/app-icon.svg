<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Logo Keuangan Vian dan Nana</title>
  <desc id="desc">Monogram V dan N dengan grafik pertumbuhan dalam emblem rose gold.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="438" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a183b"/><stop offset=".52" stop-color="#a52d55"/><stop offset="1" stop-color="#4b132b"/>
    </linearGradient>
    <linearGradient id="gold" x1="146" y1="118" x2="375" y2="391" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2cf"/><stop offset=".46" stop-color="#e9c27b"/><stop offset="1" stop-color="#b77935"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(151 107) rotate(45) scale(350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#260816" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="13" y="13" width="486" height="486" rx="109" fill="none" stroke="#f7dfad" stroke-opacity=".22" stroke-width="2"/>
  <path d="M24 282C105 157 195 80 369 47c54-10 91-5 119 2v-1H24v234Z" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="163" fill="#5b142f" fill-opacity=".44" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="#f7dfad" stroke-opacity=".25" stroke-width="2"/>
    <path d="M145 177 229 344c10 20 26 20 36 0l31-63" fill="none" stroke="url(#gold)" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M265 337V183l101 154V175" fill="none" stroke="url(#gold)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m300 216 30-31 32 17 29-37" fill="none" stroke="#fff2cf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m374 165h17v18" fill="none" stroke="#fff2cf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="117" cy="112" r="5" fill="#fff2cf" opacity=".8"/>
  <circle cx="401" cy="391" r="4" fill="#e9c27b" opacity=".65"/>
</svg>
